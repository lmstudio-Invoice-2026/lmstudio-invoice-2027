  function __readImg(inp,cb){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var maxW=600;var w=Math.min(img.width,maxW);var h=img.height*(w/img.width);canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);cb(canvas.toDataURL('image/jpeg',0.85));};img.src=e.target.result;};r.readAsDataURL(f);}
  window.__uploadLogo=function(inp){__readImg(inp,function(d){state.settings.logo=d;save();applyI18nUI();render();});};
  window.__removeLogo=function(){state.settings.logo='';save();applyI18nUI();render();};

  window.__uploadWxQR=function(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var s=200;canvas.width=s;canvas.height=s;var ctx=canvas.getContext('2d');var sc=Math.max(s/img.width,s/img.height);ctx.drawImage(img,(s-img.width*sc)/2,(s-img.height*sc)/2,img.width*sc,img.height*sc);state.settings.social.wechatQR=canvas.toDataURL('image/png');save();render();};img.src=e.target.result;};r.readAsDataURL(f);};

  var sigCtx=null,sigDrawing=false,sigHasInk=false;
  function initSig(){
    var cv=document.getElementById('sigCanvas');if(!cv)return;
    sigCtx=cv.getContext('2d');sigCtx.fillStyle='#fff';sigCtx.fillRect(0,0,cv.width,cv.height);
    sigCtx.strokeStyle='#000';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';sigHasInk=false;
    function pos(e){var r=cv.getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;var y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:x*cv.width/r.width,y:y*cv.height/r.height};}
    function start(e){e.preventDefault();sigDrawing=true;sigHasInk=true;var p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);}
    function move(e){if(!sigDrawing)return;e.preventDefault();var p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();}
    function end(){sigDrawing=false;}
    cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start);cv.addEventListener('touchmove',move);cv.addEventListener('touchend',end);
  }
  window.__clearSig=function(){if(sigCtx){sigCtx.fillStyle='#fff';sigCtx.fillRect(0,0,500,140);}sigHasInk=false;};
  window.__saveSig=function(){if(!sigHasInk){alert('Draw signature first');return;}var cv=document.getElementById('sigCanvas');state.settings.signature=cv.toDataURL('image/png');save();alert('Saved');render();};
  window.__delSig=function(){state.settings.signature='';save();render();};
  window.__uploadSig=function(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var canvas=document.createElement('canvas');var maxH=140;var h=Math.min(img.height,maxH);var w=img.width*(h/img.height);canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);state.settings.signature=canvas.toDataURL('image/png');save();alert('Signature saved');render();};img.src=e.target.result;};r.readAsDataURL(f);};

  // Additive workflow extension: existing invoice/bookings/finance/notes/settings state remains intact.
  if(!Array.isArray(state.clients))state.clients=[];
  if(!Array.isArray(state.catalog))state.catalog=SERVICES.map(function(name){return{id:uid(),name:name,price:0};});
  if(!state.settings.dateFormat)state.settings.dateFormat='ymd';
  var wfStyle=document.createElement('style');wfStyle.textContent='@media(max-width:650px){#mobileNav{display:flex!important}}';document.head.appendChild(wfStyle);
  var invoiceFilter='all',invoiceQuery='',reportPeriod='monthly',reportDate=today();
  function wfEsc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
  function wfDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return value||'';var p=value.split('-');if(state.settings.dateFormat==='dmy')return p[2]+'/'+p[1]+'/'+p[0];if(state.settings.dateFormat==='mdy')return p[1]+'/'+p[2]+'/'+p[0];return value;}
  function wfGo(view){current=view;document.querySelectorAll('.nav-btn').forEach(function(x){x.classList.toggle('active',x.dataset.view===view);});render();}
  function wfMobileNav(){var select=document.getElementById('wfMobileNav');if(!select)return;select.innerHTML=Array.from(document.querySelectorAll('.nav-btn')).map(function(button){return '<option value="'+wfEsc(button.dataset.view)+'">'+wfEsc(button.textContent)+'</option>';}).join('');select.value=current;document.getElementById('wfMobileNavLabel').textContent=t('choose_section');select.setAttribute('aria-label',t('choose_section'));}
  window.__mobileGo=wfGo;
  function wfCsvCell(value){var text=String(value==null?'':value);if(/^[\s]*[=+\-@]/.test(text)&&!/^-?\d+(?:\.\d+)?$/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}
  function wfDownloadCSV(filename,head,rows){var csv='\ufeff'+[head].concat(rows).map(function(r){return r.map(wfCsvCell).join(',');}).join('\r\n')+'\r\n';var url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));var a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(function(){URL.revokeObjectURL(url);},30000);}
  function wfInvoiceRows(ignoreQuery){return state.invoices.filter(function(i){var due=(i.due||i.date||'')<today()&&Math.max(0,invBal(i))>0;var status=invoiceFilter==='overdue'?due:invoiceFilter==='all'||i.status===invoiceFilter;var q=ignoreQuery?'':invoiceQuery.toLocaleLowerCase();return status&&(!q||[i.no,i.client,i.phone,i.method].join(' ').toLocaleLowerCase().includes(q));}).slice().reverse();}
  function wfCards(cards){return '<div style="display:flex;flex-wrap:wrap;gap:10px;margin:12px 0;">'+cards.map(function(c){return '<div class="card" style="flex:1 1 150px;padding:14px;min-width:130px;"><div style="color:var(--muted);font-size:11px;">'+wfEsc(c[0])+'</div><div style="font-size:18px;font-weight:800;color:var(--accent);margin-top:6px;">'+wfEsc(c[1])+'</div></div>';}).join('')+'</div>';}

  renderInv=function(){
    var total=0,collected=0,outstanding=0;state.invoices.forEach(function(i){total+=invTotal(i);collected+=Number(i.paid||0);outstanding+=Math.max(0,invBal(i));});
    var h='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"><h2 style="margin:0;font-size:17px;">'+t('nav_inv')+'</h2><div style="display:flex;gap:6px;"><button class="btn-ghost" onclick="window.__exportInvoiceCSV()">'+t('export_csv')+'</button><button class="btn-primary" onclick="window.__addInv()">'+t('add_inv')+'</button></div></div>';
    h+=wfCards([[t('invoice_count'),String(state.invoices.length)],[t('collected'),fmt(collected)],[t('outstanding_total'),fmt(outstanding)],[t('invoiced_total'),fmt(total)]]);
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;"><input class="field" id="invoiceSearch" value="'+wfEsc(invoiceQuery)+'" oninput="window.__invoiceSearch(this.value)" placeholder="'+wfEsc(t('search_invoices'))+'" style="flex:1 1 220px;max-width:360px;">';
    ['all','paid','partial','unpaid','overdue'].forEach(function(f){h+='<button class="subtab'+(invoiceFilter===f?' active':'')+'" onclick="window.__invoiceFilter(\''+f+'\')">'+t(f==='all'?'filter_all':f)+'</button>';});
    h+='</div><div class="card scroll-x" style="padding:6px 12px;"><table style="width:100%;border-collapse:collapse;font-size:12px;min-width:760px;"><thead><tr style="color:var(--muted);font-size:10px;"><th style="text-align:left;padding:9px 5px;">'+t('no')+'</th><th style="text-align:left;">'+t('client')+'</th><th style="text-align:left;">'+t('date')+'</th><th style="text-align:left;">'+t('due')+'</th><th style="text-align:right;">'+t('total')+'</th><th style="text-align:right;">'+t('balance')+'</th><th style="text-align:center;">'+t('status')+'</th><th style="text-align:center;">'+t('action')+'</th></tr></thead><tbody id="invoiceRows">';
    var rows=wfInvoiceRows(true);
    rows.forEach(function(i){var id=wfEsc(i.id),balance=invBal(i);h+='<tr class="tbl-row" data-id="'+id+'"><td style="padding:9px 5px;font-weight:600;">'+wfEsc(i.no)+'</td><td>'+wfEsc(i.client)+'<div style="font-size:10px;color:var(--muted);">'+wfEsc(i.phone)+'</div></td><td>'+wfEsc(wfDate(i.date))+'</td><td>'+wfEsc(wfDate(i.due||i.date))+'</td><td style="text-align:right;">'+fmt(invTotal(i))+'</td><td style="text-align:right;">'+fmt(balance)+'</td><td style="text-align:center;"><select class="field" style="width:auto;padding:3px 5px;font-size:10px;" onchange="window.__setInv(\''+id+'\',this.value)">';
      ['unpaid','partial','paid'].forEach(function(x){h+='<option value="'+x+'"'+(i.status===x?' selected':'')+'>'+t(x)+'</option>';});
      h+='</select></td><td style="text-align:center;white-space:nowrap;"><button class="btn-ghost" style="padding:4px 6px;font-size:10px;" onclick="window.__viewInv(\''+id+'\')">'+t('view')+'</button> <button class="btn-ghost" style="padding:4px 6px;font-size:10px;" onclick="window.__editInv(\''+id+'\')">'+t('edit')+'</button> <button class="btn-ghost" style="padding:4px 6px;font-size:10px;" onclick="window.__duplicateInvoice(\''+id+'\')">'+t('duplicate')+'</button> <button class="btn-danger" onclick="window.__delInv(\''+id+'\')">'+t('del')+'</button></td></tr>';});
    h+='</tbody></table></div>';document.getElementById('view').innerHTML=h;window.__invoiceSearch(invoiceQuery);
  };
  window.__invoiceFilter=function(f){invoiceFilter=f;render();};
  window.__invoiceSearch=function(q){invoiceQuery=q;var body=document.getElementById('invoiceRows');if(!body)return;var ids=new Set(wfInvoiceRows().map(function(i){return String(i.id);}));body.querySelectorAll('tr[data-id]').forEach(function(tr){tr.style.display=ids.has(tr.dataset.id)?'':'none';});var empty=body.querySelector('tr[data-empty]');if(!ids.size&&!empty)body.insertAdjacentHTML('beforeend','<tr data-empty><td colspan="8" style="padding:22px;text-align:center;color:var(--muted);">'+t('no_results')+'</td></tr>');if(ids.size&&empty)empty.remove();};

  window.__duplicateInvoice=function(id){var original=state.invoices.find(function(i){return i.id===id;});if(!original)return;var copy=JSON.parse(JSON.stringify(original));copy.id=uid();var prefix=state.settings.invPrefix||'INV',year=new Date().getFullYear(),n=state.invoices.length+1;do{copy.no=prefix+'-'+year+'-'+String(n++).padStart(4,'0');}while(state.invoices.some(function(i){return i.no===copy.no;}));copy.date=today();var dueDate=new Date();dueDate.setDate(dueDate.getDate()+Number(state.settings.dueDays||7));copy.due=dueDate.getFullYear()+'-'+String(dueDate.getMonth()+1).padStart(2,'0')+'-'+String(dueDate.getDate()).padStart(2,'0');copy.paid=0;copy.status='unpaid';state.invoices.push(copy);save();render();};

  // Daily market reference converter. Deliberately separate from the original invoice ledger.
  // No client data, customer names or amounts are sent to the exchange-rate provider.

  var fxSource=fxCodes.includes(state.settings.currency)?state.settings.currency:'MMK',fxAmount=state.settings.currency==='MMK'?'100000':'100',fxFetchedThisVisit=false;
  try{var oldFx=JSON.parse(localStorage.getItem(fxKey)||'null');if(fxValid(oldFx)){fxRates=oldFx;fxReceivedAt=oldFx.receivedAt||0;}}catch(e){}
  function fxValid(x){return x&&x.base==='USD'&&Number.isFinite(x.updatedAt)&&x.updatedAt>0&&x.updatedAt<=Date.now()+86400000&&x.rates&&fxCodes.every(function(c){return Number.isFinite(x.rates[c])&&x.rates[c]>0;})&&x.rates.USD===1;}
  function fxNeedsFetch(){return !fxRates||Date.now()>Math.max(fxRates.nextUpdate||0,fxReceivedAt+3600000);}
  function fxNumeric(){var n=Number(fxAmount);return fxAmount!==''&&Number.isFinite(n)&&n>=0?n:null;}
  function fxFmt(value,code){var digits=code==='MMK'?(value>0&&value<1?4:0):(value>0&&value<0.01?6:2);return new Intl.NumberFormat('en-US',{maximumFractionDigits:digits,minimumFractionDigits:digits}).format(value)+' '+code;}
  function fxCards(){var wrap=document.getElementById('fxCards');if(!wrap)return;if(!fxRates){wrap.innerHTML='<p style="font-size:12px;color:var(--muted);">'+t(fxInFlight?'fx_loading':'fx_unavailable')+'</p>';return;}
    var n=fxNumeric();wrap.innerHTML=n===null?'<p style="font-size:12px;color:var(--danger);">'+t('fx_invalid')+'</p>':fxCodes.map(function(c){var value=n*fxRates.rates[c]/fxRates.rates[fxSource];return '<div class="card" style="flex:1 1 128px;min-width:125px;padding:13px;"><div style="color:var(--muted);font-size:11px;">'+c+'</div><div style="font-size:16px;font-weight:700;color:var(--accent);margin-top:4px;word-break:break-word;">≈ '+fxFmt(value,c)+'</div></div>';}).join('');

    fxCodes.forEach(function(c){h+='<option value="'+c+'"'+(c===fxSource?' selected':'')+'>'+c+'</option>';});h+='</select></label><button class="btn-ghost" id="fxRefresh" onclick="window.__fxRefresh()" style="height:39px;">'+t('fx_refresh')+'</button></div><div id="fxCards" style="display:flex;flex-wrap:wrap;gap:8px;"></div><p id="fxMeta" style="font-size:11px;color:var(--muted);line-height:1.6;margin:10px 0 2px;"></p><p style="font-size:11px;color:var(--muted);line-height:1.6;margin:4px 0 2px;">'+t('fx_warning')+'</p><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer" style="font-size:11px;color:var(--accent);">'+t('fx_source')+'</a></section>';return h;}
  function fxPaint(){fxCards();var button=document.getElementById('fxRefresh');if(button)button.disabled=fxInFlight;}
  async function fxLoad(force){if(fxInFlight||(!force&&!fxNeedsFetch()))return;if(force&&fxReceivedAt&&Date.now()-fxReceivedAt<3600000&&!fxNeedsFetch()){fxError=false;fxPaint();return;}

    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
    share:'<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4M12 2v13"/>',
    download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>'
  };
  function svg(k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(I[k]||I.more)+'</svg>';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  var firstNav = document.querySelector('.nav-btn');
  var topNav = firstNav && firstNav.parentElement;
  if (topNav) topNav.id = 'topNav';
  var PRIMARY = ['dashboard','invoices','bookings','finance'];
  var bar = document.getElementById('mbar');
  var sheet = document.getElementById('msheet');

  function navBtns(){return Array.prototype.slice.call(document.querySelectorAll('.nav-btn'));}
  function navLabel(v){var b=document.querySelector('.nav-btn[data-view="'+v+'"]');return b?b.textContent.trim():v;}
  function activeView(){var b=document.querySelector('.nav-btn.active');return b?b.dataset.view:'';}
  function moreLabel(){var l=(document.getElementById('langSel')||{}).value;return {my:'နောက်ထပ်',shan:'တၢင်ႇၸိူဝ်း',zh:'更多',en:'More'}[l]||'More';}
  function go(v){var b=document.querySelector('.nav-btn[data-view="'+v+'"]');if(b){b.click();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});}}

  function paintBar(){
    var cur = activeView(), extra = navBtns().map(function(b){return b.dataset.view;}).filter(function(v){return PRIMARY.indexOf(v)<0;});
    var h = PRIMARY.map(function(v){return '<button type="button" data-go="'+v+'" class="'+(cur===v?'on':'')+'">'+svg(v)+'<span>'+esc(navLabel(v))+'</span></button>';}).join('');
    h += '<button type="button" data-go="__more" class="'+(extra.indexOf(cur)>=0?'on':'')+'">'+svg('more')+'<span>'+esc(extra.indexOf(cur)>=0?navLabel(cur):moreLabel())+'</span></button>';
    bar.innerHTML = h;
  }
  bar.addEventListener('click', function(e){
    var b = e.target.closest('button[data-go]'); if(!b) return;
    if (b.dataset.go === '__more') openMore(); else go(b.dataset.go);
  });
  function openMore(){
    var cur = activeView();
    var rows = navBtns().filter(function(b){return PRIMARY.indexOf(b.dataset.view)<0;}).map(function(b){
      var v=b.dataset.view;return '<button type="button" class="row'+(cur===v?' on':'')+'" data-go="'+v+'">'+svg(v)+'<span>'+esc(b.textContent.trim())+'</span></button>';}).join('');
    showSheet('<div class="grab"></div>'+rows);
  }
  function showSheet(html){sheet.innerHTML='<div class="msheet" role="dialog" aria-modal="true">'+html+'</div>';sheet.hidden=false;}
  function hideSheet(){sheet.hidden=true;sheet.innerHTML='';}
  sheet.addEventListener('click', function(e){
    if (e.target === sheet) return hideSheet();
    var r = e.target.closest('[data-go]'); if (r){hideSheet();go(r.dataset.go);}
  });

  // keep bar in sync with view changes & language switches
  if (topNav) new MutationObserver(paintBar).observe(topNav,{subtree:true,attributes:true,attributeFilter:['class'],childList:true,characterData:true});
  var ls = document.getElementById('langSel'); if (ls) ls.addEventListener('change', function(){setTimeout(paintBar,0);});
  paintBar();

  /* ---------- status-bar colour follows the app theme ---------- */
  var meta = document.querySelector('meta[name="theme-color"]');
  function syncTheme(){var bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();if(meta&&bg)meta.setAttribute('content',bg);}
  new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['style']});
  syncTheme();

  /* ---------- Save / Share sheet for JPEG, CSV, backup files on phones ---------- */
  var nativeClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function(){
    var a = this;
    if (!a.download || !coarse || !navigator.canShare || typeof File === 'undefined') return nativeClick.call(a);
    var name = a.download, href = a.href;
    fetch(href).then(function(r){return r.blob();}).then(function(blob){
      var type = blob.type || (/\.jpe?g$/i.test(name)?'image/jpeg':/\.csv$/i.test(name)?'text/csv':/\.json$/i.test(name)?'application/json':'application/octet-stream');
      var file = new File([blob], name, {type:type});
      if (!navigator.canShare({files:[file]})) return nativeClick.call(a);
      var isImg = /^image\//.test(type), url = URL.createObjectURL(blob);
      var L = ({my:['မျှဝေ / သိမ်းဆည်း','ဖုန်းထဲ Download','ပိတ်'],shan:['ပိုၼ်ပၼ် / သိမ်း','Download','ပိၵ်ႉ'],zh:['分享 / 保存','下载','关闭']})[(ls||{}).value]||['Share / Save','Download','Close'];
      showSheet('<div class="grab"></div><div style="font-size:13px;font-weight:700;margin:0 4px 6px;word-break:break-all;">'+esc(name)+'</div>'
        +(isImg?'<img src="'+url+'" alt="">':'')
        +'<div class="acts"><button type="button" class="btn-primary" data-act="share">'+L[0]+'</button>'
        +'<button type="button" class="btn-ghost" data-act="dl">'+L[1]+'</button>'
        +'<button type="button" class="btn-ghost" data-act="close">'+L[2]+'</button></div>');
      sheet.onclick = function(e){
        var act = (e.target.closest('[data-act]')||{}).dataset; act = act && act.act;
        if (e.target===sheet || act==='close'){sheet.onclick=null;hideSheet();setTimeout(function(){URL.revokeObjectURL(url);},1000);return;}
        if (act==='share'){navigator.share({files:[file],title:name}).catch(function(){});}
        if (act==='dl'){var d=document.createElement('a');d.href=url;d.download=name;nativeClick.call(d);}
      };
    }).catch(function(){nativeClick.call(a);});
  };

  /* ---------- keep data safe: ask the browser not to evict storage ---------- */
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});

  /* ---------- offline service worker ---------- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
  }

  /* ---------- "Add to Home Screen" hint ---------- */
  var tip = document.getElementById('mInstall'), deferred = null;
  function dismissed(){try{return localStorage.getItem('lmInstallTipOff')==='1';}catch(e){return false;}}
  function closeTip(){tip.hidden=true;try{localStorage.setItem('lmInstallTipOff','1');}catch(e){}}
  tip.addEventListener('click', function(e){
    if (e.target.closest('.x')) return closeTip();
    if (e.target.closest('[data-install]') && deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;closeTip();});}
  });
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e; if (dismissed() || standalone) return;
    tip.innerHTML='<div style="flex:1;">ဖုန်း Home Screen မှာ App အဖြစ် ထည့်ပါ — Offline သုံးလို့ရပါတယ်။<br><button type="button" class="btn-primary" data-install style="margin-top:8px;padding:8px 16px;">Install App</button></div><button type="button" class="x" aria-label="Close">×</button>';
    tip.hidden=false;
  });
  if (isIOS && !standalone && !dismissed() && MQ.matches) {
    tip.innerHTML='<div style="flex:1;">iPhone: Safari အောက်ခြေက <b>Share ⬆︎</b> ကိုနှိပ် → <b>Add to Home Screen</b> ကိုရွေးပါ။ App အဖြစ် Offline သုံးလို့ရပါမယ်။</div><button type="button" class="x" aria-label="Close">×</button>';
    tip.hidden=false;
  }
})();
</script>
